services:
  - type: web
    name: citexa-ai-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false # Set in the Render dashboard; never commit credentials
      - key: LLM_API_KEY
        value: "your_api_key_here" # User can update this in Render dashboard
      - key: PYTHON_VERSION
        value: "3.10"
